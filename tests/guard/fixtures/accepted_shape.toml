# Generic accepted-state shape for the guard's regression test (tests/guard/test_accepted_shape.py): negative per-point P offsets on all eight P-cores,
# E 47x OC points with adaptive targets 1.077-1.097 V and point 6 at -100 mV on every E cluster, turbo P 57,57,55x6 / E 47x8. No OC point on P.
